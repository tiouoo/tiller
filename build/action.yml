name: Tiller rolling build metadata
description: Generate reproducible commit or nightly build metadata.
inputs:
  kind:
    description: Build kind used in the generated title and JSON.
    required: true
  base-version-file:
    description: File containing the stable application version.
    required: false
    default: assets/conf/version.txt
  epoch:
    description: Asia/Shanghai timestamp used as day zero.
    required: true
outputs:
  json:
    value: ${{ steps.meta.outputs.json }}
  app_version:
    value: ${{ steps.meta.outputs.app_version }}
  commit:
    value: ${{ steps.meta.outputs.commit }}
  commit_hash:
    value: ${{ steps.meta.outputs.commit }}
  timestamp:
    value: ${{ steps.meta.outputs.timestamp }}
  title:
    value: ${{ steps.meta.outputs.title }}
runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        TILLER_BUILD_KIND: ${{ inputs.kind }}
        TILLER_BASE_VERSION_FILE: ${{ inputs.base-version-file }}
        TILLER_BUILD_EPOCH: ${{ inputs.epoch }}
        TILLER_RUN_ID: ${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/build-metadata.sh"
