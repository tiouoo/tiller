name: Tiller metadata
description: Format caller-provided values as release metadata JSON.
inputs:
  type:
    required: true
  version:
    required: true
  commit:
    required: true
  title:
    required: true
  timestamp:
    required: false
    default: ""
outputs:
  json:
    value: ${{ steps.metadata.outputs.json }}
  build-time:
    value: ${{ steps.metadata.outputs.build_time }}
  release-date:
    value: ${{ steps.metadata.outputs.release_date }}
runs:
  using: composite
  steps:
    - id: metadata
      shell: bash
      env:
        TILLER_TYPE: ${{ inputs.type }}
        TILLER_VERSION: ${{ inputs.version }}
        TILLER_COMMIT: ${{ inputs.commit }}
        TILLER_TITLE: ${{ inputs.title }}
        TILLER_TIMESTAMP: ${{ inputs.timestamp }}
        TILLER_RUN_ID: ${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/metadata.sh"
