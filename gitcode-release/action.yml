name: Tiller GitCode release
description: Create or update one GitCode Release for an existing tag.
inputs:
  token:
    required: false
  repository:
    required: true
  tag:
    required: true
  name:
    required: false
    default: ""
  body-file:
    required: false
    default: ""
  prerelease:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITCODE_TOKEN: ${{ inputs.token }}
        GITCODE_REPO: ${{ inputs.repository }}
        GITCODE_TAG: ${{ inputs.tag }}
        GITCODE_NAME: ${{ inputs.name }}
        GITCODE_BODY_FILE: ${{ inputs['body-file'] }}
        GITCODE_PRERELEASE: ${{ inputs.prerelease }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/gitcode-release.sh"
