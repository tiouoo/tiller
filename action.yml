name: Tiller release metadata
description: Generate the next release version and common release metadata.
inputs:
  version:
    description: Optional explicit X.Y.Z version.
    required: false
    default: ""
  name-prefix:
    description: Text placed before the generated version in the release name.
    required: false
    default: "v"
outputs:
  version:
    description: Version without the v prefix.
    value: ${{ steps.meta.outputs.version }}
  tag:
    description: Version tag.
    value: ${{ steps.meta.outputs.tag }}
  previous_tag:
    description: Previous stable version tag, when present.
    value: ${{ steps.meta.outputs.previous_tag }}
  commit:
    description: Seven-character commit hash.
    value: ${{ steps.meta.outputs.commit }}
  commit_hash:
    description: Alias of commit.
    value: ${{ steps.meta.outputs.commit }}
  base_commit:
    description: Alias of commit.
    value: ${{ steps.meta.outputs.commit }}
  build_time:
    description: ISO-8601 build time in Asia/Shanghai.
    value: ${{ steps.meta.outputs.build_time }}
  release_date:
    description: Human-readable release time in Asia/Shanghai.
    value: ${{ steps.meta.outputs.release_date }}
  release_name:
    description: Release name composed from the requested prefix and version.
    value: ${{ steps.meta.outputs.release_name }}
  json:
    description: Release metadata JSON.
    value: ${{ steps.meta.outputs.json }}
runs:
  using: composite
  steps:
    - id: meta
      shell: bash
      env:
        TILLER_VERSION: ${{ inputs.version }}
        TILLER_NAME_PREFIX: ${{ inputs.name-prefix }}
        TILLER_RUN_ID: ${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/version.sh"
