name: Tiller changelog
description: Generate a Markdown changelog between explicit refs or the latest stable tag.
inputs:
  base-ref:
    description: Base ref, auto for the latest stable tag, or none for initial history.
    required: false
    default: auto
  head-ref:
    description: Commit to describe, independent of the current checkout.
    required: false
    default: HEAD
  initial-history:
    description: Use recent (20 commits) or all when there is no base ref.
    required: false
    default: recent
  output:
    description: Output Markdown file.
    required: false
    default: RELEASE_CHANGELOG.md
  empty-message:
    description: Text written when the selected range has no commits.
    required: false
    default: No changes since the previous stable release.
outputs:
  file:
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TILLER_CHANGELOG_OUTPUT: ${{ inputs.output }}
        TILLER_EMPTY_MESSAGE: ${{ inputs['empty-message'] }}
        TILLER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        TILLER_SHA: ${{ github.sha }}
        TILLER_BASE_REF: ${{ inputs['base-ref'] }}
        TILLER_HEAD_REF: ${{ inputs['head-ref'] }}
        TILLER_INITIAL_HISTORY: ${{ inputs['initial-history'] }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/changelog.sh"
