name: Tiller CNB release
description: Create or replace one CNB Release for an existing tag.
inputs:
  token:
    required: false
  repository:
    required: true
  tag:
    required: true
  name:
    required: false
    default: ""
  body-file:
    required: false
    default: ""
  files:
    required: false
    default: ""
  prerelease:
    required: false
    default: "false"
  make-latest:
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CNB_TOKEN: ${{ inputs.token }}
        CNB_REPO: ${{ inputs.repository }}
        CNB_TAG: ${{ inputs.tag }}
        CNB_NAME: ${{ inputs.name }}
        CNB_BODY_FILE: ${{ inputs['body-file'] }}
        CNB_FILES: ${{ inputs.files }}
        CNB_PRERELEASE: ${{ inputs.prerelease }}
        CNB_MAKE_LATEST: ${{ inputs['make-latest'] }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/cnb-release.sh"
