name: Tiller / NuGet

on:
  workflow_call:
    inputs:
      version:
        description: Optional explicit X.Y.Z version.
        required: false
        type: string
        default: ""
      dotnet-version:
        required: false
        type: string
        default: 10.x
      pack-script:
        description: Caller script that writes packages to artifacts/.
        required: false
        type: string
        default: .github/scripts/pack-nuget.sh
      release-name-prefix:
        required: true
        type: string
      cnb-repository:
        required: false
        type: string
        default: ""
      gitcode-repository:
        required: false
        type: string
        default: ""
    secrets:
      NUGET_USER:
        required: true
      CNB_TOKEN:
        required: false
      GITCODE_TOKEN:
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        uses: tiouoo/tiller@v1
        with:
          version: ${{ inputs.version }}
          name-prefix: "${{ inputs['release-name-prefix'] }} "
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs['dotnet-version'] }}
      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Pack NuGet packages
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash "${{ inputs['pack-script'] }}"
      - name: Publish NuGet packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create and push tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.release_name }}
        run: |
          files=(artifacts/*.nupkg)
          compgen -G 'artifacts/*.snupkg' >/dev/null && files+=(artifacts/*.snupkg)
          gh release create "$TAG" "${files[@]}" --title "$NAME" --generate-notes
      - name: Sync CNB release
        if: inputs['cnb-repository'] != ''
        uses: tiouoo/tiller/cnb@v1
        with:
          token: ${{ secrets.CNB_TOKEN }}
          repository: ${{ inputs['cnb-repository'] }}
          tag: ${{ steps.meta.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
      - name: Sync GitCode release
        if: inputs['gitcode-repository'] != ''
        uses: tiouoo/tiller/gitcode@v1
        with:
          token: ${{ secrets.GITCODE_TOKEN }}
          repository: ${{ inputs['gitcode-repository'] }}
          tag: ${{ steps.meta.outputs.tag }}
          commit: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
